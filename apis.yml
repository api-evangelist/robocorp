aid: robocorp
name: Robocorp
description: >-
  Robocorp is an open source RPA and workflow automation platform for building Python-based automation bots. The
  platform provides the Control Room API for managing workspaces, workers, processes, work items, assets, vaults,
  webhooks, and task packages. Robocorp also provides the RPA Framework, an open-source collection of Python libraries
  for robotic process automation including browser, desktop, email, Excel, PDF, and cloud service automation. The
  platform has evolved toward Sema4 AI for AI-powered automation actions.
