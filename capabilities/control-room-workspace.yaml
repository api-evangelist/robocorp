naftiko: 1.0.0-alpha2
info:
  label: Robocorp Control Room API — Workspace
  description: 'Robocorp Control Room API — Workspace. 1 operations. Lead operation: Get Workspace. Self-contained Naftiko
    capability covering one Robocorp business surface.'
  tags:
  - Robocorp
  - Workspace
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ROBOCORP_API_KEY: ROBOCORP_API_KEY
capability:
  consumes:
  - type: http
    namespace: control-room-workspace
    baseUri: https://cloud.robocorp.com/api/v1
    description: Robocorp Control Room API — Workspace business capability. Self-contained, no shared references.
    resources:
    - name: workspaces-workspace_id
      path: /workspaces/{workspace_id}
      operations:
      - name: getworkspace
        method: GET
        description: Get Workspace
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.ROBOCORP_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: control-room-workspace-rest
    port: 8080
    description: REST adapter for Robocorp Control Room API — Workspace. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/workspaces/{workspace-id}
      name: workspaces-workspace-id
      description: REST surface for workspaces-workspace_id.
      operations:
      - method: GET
        name: getworkspace
        description: Get Workspace
        call: control-room-workspace.getworkspace
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: control-room-workspace-mcp
    port: 9090
    transport: http
    description: MCP adapter for Robocorp Control Room API — Workspace. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-workspace
      description: Get Workspace
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: control-room-workspace.getworkspace
      outputParameters:
      - type: object
        mapping: $.
